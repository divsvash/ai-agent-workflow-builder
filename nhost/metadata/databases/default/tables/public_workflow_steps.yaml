table:
  schema: public
  name: workflow_steps
object_relationships:
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
array_relationships:
  - name: outputs
    using:
      foreign_key_constraint_on:
        column: workflow_step_id
        table:
          schema: public
          name: workflow_outputs
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - workflow_id
        - step_order
        - type
        - config
        - created_at
        - updated_at
      filter:
        workflow:
          organization:
            members:
              user_id:
                _eq: X-Hasura-User-Id
      allow_aggregations: false
  - role: service
    permission:
      columns:
        - id
        - workflow_id
        - step_order
        - type
        - config
        - created_at
        - updated_at
      filter: {}
insert_permissions:
  - role: user
    permission:
      # LAYER 2: db_write/notify steps require the requesting user to be an
      # 'owner' of the workflow's org. All other step types only require
      # owner OR editor. This is a pure Hasura row-level check expression,
      # no extra Postgres logic.
      check:
        _or:
          - _and:
              - type:
                  _in: [llm_call, http_request, conditional_branch, approval_gate]
              - workflow:
                  organization:
                    members:
                      _and:
                        - user_id:
                            _eq: X-Hasura-User-Id
                        - role:
                            _in: [owner, editor]
          - _and:
              - type:
                  _in: [db_write, notify]
              - workflow:
                  organization:
                    members:
                      _and:
                        - user_id:
                            _eq: X-Hasura-User-Id
                        - role:
                            _eq: owner
      columns:
        - workflow_id
        - step_order
        - type
        - config
update_permissions:
  - role: user
    permission:
      columns:
        - step_order
        - type
        - config
      filter:
        _or:
          - _and:
              - type:
                  _in: [llm_call, http_request, conditional_branch, approval_gate]
              - workflow:
                  organization:
                    members:
                      _and:
                        - user_id:
                            _eq: X-Hasura-User-Id
                        - role:
                            _in: [owner, editor]
          - _and:
              - type:
                  _in: [db_write, notify]
              - workflow:
                  organization:
                    members:
                      _and:
                        - user_id:
                            _eq: X-Hasura-User-Id
                        - role:
                            _eq: owner
      # 'check' re-runs the same expression against the POST-update row, so an
      # editor cannot flip a step's type to db_write/notify to smuggle past
      # the pre-update filter above.
      check:
        _or:
          - _and:
              - type:
                  _in: [llm_call, http_request, conditional_branch, approval_gate]
              - workflow:
                  organization:
                    members:
                      _and:
                        - user_id:
                            _eq: X-Hasura-User-Id
                        - role:
                            _in: [owner, editor]
          - _and:
              - type:
                  _in: [db_write, notify]
              - workflow:
                  organization:
                    members:
                      _and:
                        - user_id:
                            _eq: X-Hasura-User-Id
                        - role:
                            _eq: owner
delete_permissions:
  - role: user
    permission:
      filter:
        _or:
          - _and:
              - type:
                  _in: [llm_call, http_request, conditional_branch, approval_gate]
              - workflow:
                  organization:
                    members:
                      _and:
                        - user_id:
                            _eq: X-Hasura-User-Id
                        - role:
                            _in: [owner, editor]
          - _and:
              - type:
                  _in: [db_write, notify]
              - workflow:
                  organization:
                    members:
                      _and:
                        - user_id:
                            _eq: X-Hasura-User-Id
                        - role:
                            _eq: owner
