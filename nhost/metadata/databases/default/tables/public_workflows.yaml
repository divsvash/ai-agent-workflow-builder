table:
  schema: public
  name: workflows
object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: org_id
array_relationships:
  - name: steps
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          schema: public
          name: workflow_steps
  - name: triggers
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          schema: public
          name: workflow_triggers
  - name: runs
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          schema: public
          name: workflow_runs
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - org_id
        - name
        - description
        - created_by
        - created_at
        - updated_at
      filter:
        organization:
          members:
            user_id:
              _eq: X-Hasura-User-Id
      allow_aggregations: false
  - role: service
    permission:
      columns:
        - id
        - org_id
        - name
        - description
        - created_by
        - created_at
        - updated_at
      filter: {}
insert_permissions:
  - role: user
    permission:
      check:
        organization:
          members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _in: [owner, editor]
      columns:
        - org_id
        - name
        - description
        - created_by
      set:
        created_by: X-Hasura-User-Id
update_permissions:
  - role: user
    permission:
      columns:
        - name
        - description
      filter:
        organization:
          members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _in: [owner, editor]
      check: null
delete_permissions:
  - role: user
    permission:
      filter:
        organization:
          members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: owner
# ASSUMPTION: workflow deletion is not specified in the assignment; restricted
# to owner as a conservative default since it cascades to steps/triggers/runs.
